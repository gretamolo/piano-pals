/* ==========================================================================
   ROUTER + EVENT DELEGATION
   ========================================================================== */
function currentView() {
  switch (S.screen) {
    case "picker": return viewPicker();
    case "home": return viewHome();
    case "songs": return viewSongs();
    case "prep": return viewPrep();
    case "play": return viewPlay();
    case "lessons": return viewLessons();
    case "lesson": return viewLesson();
    case "free": return viewFree();
    case "stars": return viewStars();
    default: return viewPicker();
  }
}

let lastScreen = null;
function render() {
  Game.destroy();
  if (S.screen !== "play") keepAwake(false);
  if (S.screen !== "free") { FREE.guess = null; FREE.playing = false; }
  const k = curKid();
  const col = k ? k.color : "#F25CA8";
  document.documentElement.style.setProperty("--kid", col);

  const scrolling = (S.screen === "songs" || S.screen === "lessons" || S.screen === "stars");
  const prevScroll = scrolling && lastScreen === S.screen ? window.__scrollY || 0 : 0;

  app.innerHTML = currentView();

  // per-screen wiring
  if (S.screen === "play") {
    buildKeyboard();
    if (Game.wantStart) {
      Game.wantStart = false;
      Game.start(Game.song, Game.ver, Game.mode);
      buildKeyboard();       // rebuild with the song's real range + hot keys
      keepAwake(true);
    }
    const hud = $("#hud");
    if (hud) hud.textContent = "⭐ 0 / " + Game.total;
  }
  if (S.screen === "lesson") wireLesson();
  if (S.screen === "free") wireFree();
  if (scrolling && prevScroll) window.scrollTo(0, prevScroll);
  lastScreen = S.screen;
}

/* one delegated listener for the whole app */
document.addEventListener("click", function (e) {
  const t = e.target;
  if (!t || !t.closest) return;
  const hit = function (sel) { return t.closest(sel); };
  let el;

  // ---- celebration overlay (song finished) ----
  if ((el = hit("[data-cel-replay]"))) {
    const ov = el.closest(".celebrate"); if (ov) ov.remove();
    Snd.unlock();
    Game.start(Game.song, Game.ver, Game.mode);
    buildKeyboard();
    const hud = $("#hud"); if (hud) hud.textContent = "⭐ 0 / " + Game.total;
    return;
  }
  if ((el = hit("[data-cel-next]"))) {
    const ov = el.closest(".celebrate"); if (ov) ov.remove();
    const id = el.getAttribute("data-cel-next");
    const k = curKid();
    go("prep", { songId: id, ver: k && k.id === "kai" ? "first" : "full", mode: Game.mode });
    return;
  }
  if ((el = hit("[data-cel-back]"))) {
    const ov = el.closest(".celebrate"); if (ov) ov.remove();
    go("songs");
    return;
  }
  if ((el = hit("[data-cel-nextlesson]"))) {
    const ov = el.closest(".celebrate"); if (ov) ov.remove();
    const i = LESSONS.indexOf(L.lesson);
    if (LESSONS[i + 1]) startLesson(LESSONS[i + 1].id); else go("lessons");
    return;
  }
  if ((el = hit("[data-cel-backlessons]"))) {
    const ov = el.closest(".celebrate"); if (ov) ov.remove();
    go("lessons");
    return;
  }

  if ((el = hit("[data-grown]"))) { openGrown(); return; }
  if ((el = hit("[data-close-modal]"))) { closeModal(); return; }
  if ((el = hit("[data-toggle-sound]"))) {
    Snd.setEnabled(!Snd.enabled);
    DB.grown.sound = Snd.enabled;
    if (curKid()) { curKid().settings.sound = Snd.enabled; }
    saveDB();
    el.classList.toggle("on", Snd.enabled);
    return;
  }
  if ((el = hit("[data-toggle-unlock]"))) {
    DB.grown.unlockAll = !DB.grown.unlockAll;
    saveDB();
    el.classList.toggle("on", DB.grown.unlockAll);
    toast(DB.grown.unlockAll ? "All songs unlocked 🔓" : "Songs lock again 🔒");
    return;
  }
  if ((el = hit("[data-reset]"))) {
    const k = curKid();
    if (!k) return;
    if (!confirm("Reset " + k.name + "'s stars and lessons? This cannot be undone.")) return;
    k.progress = blankProgress();
    saveDB();
    closeModal();
    toast("Progress reset for " + k.name);
    go("home");
    return;
  }
  if ((el = hit("[data-addkid]"))) { openKidEditor(null); return; }
  if ((el = hit("[data-editkid]"))) {
    const k = curKid();
    if (k) openKidEditor(k);
    return;
  }
  if ((el = hit("[data-savekid]")) || (el = hit("[data-delkid]"))) { return; } // handled locally

  // kid selection
  if ((el = hit("[data-kid]"))) {
    const id = el.getAttribute("data-kid");
    const k = kidById(id);
    if (!k) return;
    DB.cur = id;
    saveDB();
    Snd.unlock();
    Snd.play(72, { vol: 0.4, dur: 0.7 });
    Snd.play(76, { time: (Snd.ctx ? Snd.ctx.currentTime : 0) + 0.1, vol: 0.35, dur: 0.7 });
    document.documentElement.style.setProperty("--kid", k.color);
    if (k.settings && k.settings.sound === false) Snd.setEnabled(false); else Snd.setEnabled(true);
    go("home");
    return;
  }
  if ((el = hit("[data-switch]"))) { DB.cur = null; saveDB(); go("picker"); return; }

  // home tiles
  if ((el = hit("[data-go]"))) {
    const g = el.getAttribute("data-go");
    Snd.unlock();
    Snd.play(67, { vol: 0.3, dur: 0.4 });
    if (g === "songs") go("songs");
    else if (g === "lessons") go("lessons");
    else if (g === "free") go("free");
    else if (g === "stars") go("stars");
    return;
  }
  if ((el = hit("[data-back]"))) {
    Snd.unlock();
    if (S.screen === "home") { DB.cur = null; saveDB(); go("picker"); }
    else if (S.screen === "stars" || S.screen === "free" || S.screen === "lessons" || S.screen === "songs") go("home");
    else if (S.screen === "prep") go("songs");
    else go("home");
    return;
  }

  // songs
  if ((el = hit("[data-song]"))) {
    const id = el.getAttribute("data-song");
    if (el.hasAttribute("data-locked")) {
      Snd.thud();
      toast("Finish the song before it first 🔒 (or ask a grown-up)");
      return;
    }
    const s = SONGS.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    const k = curKid();
    // Kai is the 4-year-old: short version, notes wait for him.
    // Everyone else starts on the whole tune with a steady beat.
    const little = !!(k && k.id === "kai");
    S.ver = little ? "first" : "full";
    S.mode = little ? "wait" : "timed";
    go("prep", { songId: id, ver: S.ver, mode: S.mode });
    return;
  }
  if ((el = hit("[data-ver]"))) {
    S.ver = el.getAttribute("data-ver");
    Snd.unlock(); Snd.play(72, { vol: 0.35, dur: 0.4 });
    render();
    return;
  }
  if ((el = hit("[data-mode]"))) {
    S.mode = el.getAttribute("data-mode");
    Snd.unlock(); Snd.play(72, { vol: 0.35, dur: 0.4 });
    render();
    return;
  }
  if ((el = hit("[data-listen-song]"))) {
    const s2 = SONGS.filter(function (x) { return x.id === S.songId; })[0];
    if (!s2) return;
    Snd.unlock();
    stopListening();
    if (el.dataset.busy) { el.dataset.busy = ""; el.textContent = "🔊 Hear it"; return; }
    el.dataset.busy = "1";
    el.textContent = "🔈 Playing…";
    Game.listen = Snd.melody(S.ver === "first" ? s2.first : s2.full, s2.bpm, function () {
      Game.listen = null;
      const b2 = document.querySelector("[data-listen-song]");
      if (b2) { b2.textContent = "🔊 Hear it"; b2.dataset.busy = ""; }
    });
    return;
  }
  if ((el = hit("[data-start]"))) {
    stopListening();
    const s = SONGS.filter(function (x) { return x.id === S.songId; })[0];
    if (!s) return;
    Snd.unlock();
    Game.song = s; Game.ver = S.ver; Game.mode = S.mode; Game.wantStart = true;
    go("play");
    return;
  }
  if ((el = hit("[data-exitplay]"))) {
    Game.destroy();
    go("songs");
    return;
  }

  // lessons
  if ((el = hit("[data-lesson]"))) {
    if (el.hasAttribute("data-locked")) {
      Snd.thud();
      toast("Finish the lesson before it first ⭐ (or ask a grown-up)");
      return;
    }
    startLesson(el.getAttribute("data-lesson"));
    return;
  }
  if ((el = hit("[data-exitlesson]"))) { go("lessons"); return; }
});

    const cel = $(".celebrate");

});

/* pause the scrolling game when the tab is hidden */
document.addEventListener("visibilitychange", function () {
  if (document.hidden) Game.pause();
  else Game.resume();
});

/* ---------------------------------------------------------------- boot */
function boot() {
  const k = curKid();
  if (k) {
    document.documentElement.style.setProperty("--kid", k.color);
    Snd.setEnabled(!(k.settings && k.settings.sound === false));
  }
  render();
}
boot();

/* Read-only hook, used by the smoke tests and handy for debugging.
   It exposes nothing that can change the app. */
window.PianoPals = {
  songs: SONGS,
  lessons: LESSONS,
  state: function () {
    return {
      screen: S.screen, songId: S.songId, ver: S.ver, mode: S.mode,
      lesson: L.lesson ? L.lesson.id : null, step: L.step, prog: L.prog,
      stepType: L.lesson && L.lesson.steps[L.step] ? L.lesson.steps[L.step].type : null,
      gameHits: Game.hits, gameTotal: Game.total, gameRunning: Game.running
    };
  },
  db: function () { return JSON.parse(JSON.stringify(DB)); }
};
})();
</script>
</body>
